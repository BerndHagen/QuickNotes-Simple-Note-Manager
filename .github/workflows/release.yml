name: Create Release

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The rolling preview is updated in place on every push to main. It is a
  # transparent build ledger, not a substitute for curated stable notes.
  latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate curated release notes
        run: npm run validate:release-notes

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../quicknotes-latest.zip .

      - name: Prepare latest-build notes
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_DATE=$(date -u +"%d %B %Y at %H:%M UTC")
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -n "$LATEST_TAG" ]; then
            RANGE="${LATEST_TAG}..HEAD"
            COMMIT_COUNT=$(git rev-list --count "$RANGE")
            BASELINE="\`${LATEST_TAG}\`"
          else
            RANGE=""
            COMMIT_COUNT=$(git rev-list --count HEAD)
            BASELINE="No stable tag is available yet"
          fi

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            CHANGE_COUNT="1 commit"
          else
            CHANGE_COUNT="${COMMIT_COUNT} commits"
          fi

          cat > latest-release-notes.md <<EOF
          This rolling preview contains the newest verified QuickNotes build from the \`main\` branch. It is intended for early access and testing; users who prefer a fixed milestone should choose the latest stable release.

          > This release is updated in place whenever \`main\` changes. Its ZIP, source commit, and notes always describe the same build.

          ### Build Information

          - **Updated**: ${RELEASE_DATE}
          - **Source commit**: [\`${SHORT_SHA}\`](https://github.com/${REPOSITORY}/commit/${COMMIT_SHA})
          - **Stable baseline**: ${BASELINE}
          - **Included changes**: ${CHANGE_COUNT} since that baseline

          ### Changes Since the Stable Release

          EOF

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "- **No unreleased changes**: this preview currently matches the stable release." >> latest-release-notes.md
          else
            if [ -n "$RANGE" ]; then
              HASHES=$(git log "$RANGE" --no-merges --format='%H' --reverse)
            else
              HASHES=$(git log --no-merges -20 --format='%H' --reverse)
            fi

            while read -r HASH; do
              [ -z "$HASH" ] && continue
              SUBJECT=$(git log -1 "$HASH" --format='%s')
              CLEAN_SUBJECT=$(printf '%s' "$SUBJECT" | sed -E 's/^(feat|fix|docs|style|refactor|test|ci|build|chore|perf)(\([^)]*\))?:[[:space:]]*//')
              FIRST_CHAR=$(printf '%s' "$CLEAN_SUBJECT" | cut -c1 | tr '[:lower:]' '[:upper:]')
              REST=$(printf '%s' "$CLEAN_SUBJECT" | cut -c2-)
              CLEAN_SUBJECT="${FIRST_CHAR}${REST}"
              HASH_SHORT=$(git rev-parse --short "$HASH")
              printf -- '- **%s**: [`%s`](https://github.com/%s/commit/%s)\n' "$CLEAN_SUBJECT" "$HASH_SHORT" "$REPOSITORY" "$HASH" >> latest-release-notes.md
            done <<< "$HASHES"
          fi

          cat >> latest-release-notes.md <<EOF

          ### Availability

          - **Preview archive**: \`quicknotes-latest.zip\` is rebuilt from the source commit shown above.
          - **Stable downloads**: use the [versioned releases](https://github.com/${REPOSITORY}/releases) for permanent, curated milestones.
          - **Hosted application**: the same \`main\` build is published to [GitHub Pages](https://berndhagen.github.io/QuickNotes-Simple-Note-Manager/).

          **Note:** If you encounter a problem, please open an [issue](https://github.com/${REPOSITORY}/issues). For questions and product discussion, use [GitHub Discussions](https://github.com/${REPOSITORY}/discussions).
          EOF

      - name: Move rolling tag to this build
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Update latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: QuickNotes - Simple Note Manager - Latest Build
          body_path: latest-release-notes.md
          prerelease: true
          files: quicknotes-latest.zip
          overwrite_files: true

  # Stable tags are permanent product milestones. Their notes must be written
  # and reviewed in docs/releases before the tag is pushed.
  versioned:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate curated release notes
        run: npm run validate:release-notes

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare version metadata and curated notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-quicknotes}"
          NOTES_PATH="docs/releases/${TAG}.md"

          if [ ! -s "$NOTES_PATH" ]; then
            echo "::error::Missing curated release notes at ${NOTES_PATH}. Copy docs/releases/TEMPLATE.md, organize the changes by product area, and commit it before tagging."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../quicknotes-${{ steps.version.outputs.tag }}.zip .

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuickNotes - Simple Note Manager ${{ steps.version.outputs.version }}
          body_path: ${{ steps.version.outputs.notes_path }}
          files: quicknotes-${{ steps.version.outputs.tag }}.zip
          overwrite_files: true
