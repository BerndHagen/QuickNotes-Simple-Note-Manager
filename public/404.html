<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>QuickNotes</title>
    <script>
      // GitHub Pages serves this document for unknown paths. The app shell
      // decodes the query representation and restores the original URL.
      const basePath = '__QUICKNOTES_BASE_PATH__'
      const pathSegmentsToKeep = basePath.split('/').filter(Boolean).length
      const locationParts = window.location
      const targetBase = locationParts.pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/')

      locationParts.replace(
        `${locationParts.origin}${targetBase}/?/${locationParts.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')}${locationParts.search
          ? `&${locationParts.search.slice(1).replace(/&/g, '~and~')}`
          : ''}${locationParts.hash}`,
      )
    </script>
  </head>
  <body>
    <noscript>
      <p>QuickNotes requires JavaScript. <a href="__QUICKNOTES_BASE_PATH__">Return to QuickNotes</a>.</p>
    </noscript>
  </body>
</html>
